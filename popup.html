<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Commander</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#050a05; --bg2:#0a110a;
  --green:#00ff41; --green-dim:#00aa2b; --green-dark:#001a08;
  --border:rgba(0,255,65,0.15); --border-hi:rgba(0,255,65,0.45);
  --text:#c8ffd4; --text-dim:#3d6644;
}
body {
  width:500px; background:var(--bg);
  color:var(--text); font-family:'Share Tech Mono',monospace;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);
}

/* HEADER */
.header {
  padding:14px 18px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(180deg,#0d1a0d 0%,var(--bg) 100%);
}
.logo {
  width:34px; height:34px; border:2px solid var(--green); border-radius:5px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Orbitron',monospace; font-size:11px; color:var(--green);
  text-shadow:0 0 10px var(--green);
  box-shadow:0 0 12px rgba(0,255,65,0.3),inset 0 0 10px rgba(0,255,65,0.1);
  animation:logopulse 3s ease-in-out infinite;
}
@keyframes logopulse {
  0%,100%{box-shadow:0 0 12px rgba(0,255,65,0.3),inset 0 0 10px rgba(0,255,65,0.1);}
  50%{box-shadow:0 0 22px rgba(0,255,65,0.6),inset 0 0 16px rgba(0,255,65,0.2);}
}
.htext{flex:1;}
.title {
  font-family:'Orbitron',monospace; font-size:12px; font-weight:900;
  color:var(--green); text-shadow:0 0 10px rgba(0,255,65,0.7); letter-spacing:3px;
}
.subtitle { font-size:9px; color:var(--text-dim); letter-spacing:2px; margin-top:2px; }
.dot {
  width:8px; height:8px; border-radius:50%; background:var(--green);
  box-shadow:0 0 8px var(--green); animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}

/* PANELS */
.panels { padding:12px 14px; display:flex; flex-direction:column; gap:9px; }
.panel {
  border:1px solid var(--border); border-radius:6px;
  background:var(--bg2); overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
}
.panel:hover { border-color:var(--border-hi); box-shadow:0 0 14px rgba(0,255,65,0.07); }
.ph {
  display:flex; align-items:center; gap:9px; padding:8px 12px;
  border-bottom:1px solid var(--border); background:rgba(0,0,0,0.35);
}
.badge {
  padding:2px 8px; border-radius:3px; border:1px solid;
  font-family:'Orbitron',monospace; font-size:9px; font-weight:700; letter-spacing:2px;
}
.alabel { font-size:10px; color:var(--text-dim); flex:1; letter-spacing:1px; }
.sbadge {
  font-size:9px; letter-spacing:1px; padding:2px 7px; border-radius:2px;
  border:1px solid rgba(0,255,65,0.15); color:var(--text-dim);
  transition:all .3s;
}
.sbadge.sending { color:#ffcc00; border-color:rgba(255,204,0,0.4); animation:pulse .8s infinite; }
.sbadge.done    { color:var(--green); border-color:rgba(0,255,65,0.4); }
.sbadge.error   { color:#ff4444; border-color:rgba(255,68,68,0.4); }
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.sbtn {
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  font-family:'Share Tech Mono',monospace; font-size:9px; padding:3px 9px;
  border-radius:3px; cursor:pointer; letter-spacing:1px; transition:all .2s;
}
.sbtn:hover { border-color:var(--green-dim); color:var(--green); box-shadow:0 0 8px rgba(0,255,65,0.2); }
.pb { padding:9px 12px; }
textarea {
  width:100%; background:rgba(0,255,65,0.02); border:1px solid rgba(0,255,65,0.08);
  border-radius:4px; color:var(--text); font-family:'Share Tech Mono',monospace;
  font-size:11px; line-height:1.65; padding:8px 10px; resize:none; height:68px;
  outline:none; transition:border-color .2s,box-shadow .2s; letter-spacing:.3px;
}
textarea::placeholder { color:var(--text-dim); opacity:.55; }
textarea:focus {
  border-color:rgba(0,255,65,0.35); background:rgba(0,255,65,0.035);
  box-shadow:0 0 8px rgba(0,255,65,0.1);
}

/* BOTTOM */
.bottom { padding:11px 14px 15px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:9px; }
.firebtn {
  width:100%; padding:12px; cursor:pointer; border-radius:5px;
  background:linear-gradient(135deg,#001a08 0%,#00330f 100%);
  border:1px solid var(--green-dim); color:var(--green);
  font-family:'Orbitron',monospace; font-size:12px; font-weight:700; letter-spacing:4px;
  text-shadow:0 0 10px rgba(0,255,65,0.7);
  box-shadow:0 0 15px rgba(0,255,65,0.15),inset 0 0 15px rgba(0,255,65,0.04);
  transition:all .2s; position:relative; overflow:hidden;
}
.firebtn::before {
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,65,0.12),transparent);
  transition:left .45s;
}
.firebtn:hover::before { left:100%; }
.firebtn:hover {
  background:linear-gradient(135deg,#002b10 0%,#004d18 100%);
  box-shadow:0 0 28px rgba(0,255,65,0.3),inset 0 0 20px rgba(0,255,65,0.1);
  border-color:var(--green);
}
.firebtn:active { transform:scale(.99); }
.logbox {
  background:rgba(0,0,0,0.55); border:1px solid var(--border);
  border-radius:4px; padding:7px 10px; font-size:10px;
  color:var(--text-dim); height:52px; overflow-y:auto;
  letter-spacing:.4px; line-height:1.9;
}
.le { color:var(--text-dim); }
.le.ok  { color:var(--green-dim); }
.le.err { color:#ff4444; }
.le.inf { color:#4fc3f7; }
.row { display:flex; justify-content:space-between; align-items:center; }
.clrbtn {
  background:transparent; border:1px solid rgba(255,68,68,0.2); color:rgba(255,68,68,0.45);
  font-family:'Share Tech Mono',monospace; font-size:9px; padding:3px 10px;
  border-radius:3px; cursor:pointer; letter-spacing:1px; transition:all .2s;
}
.clrbtn:hover { border-color:rgba(255,68,68,0.5); color:rgba(255,68,68,0.8); }
.counter { font-size:9px; color:var(--text-dim); letter-spacing:1px; }

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--green-dark);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--green-dim);}
</style>
</head>
<body>

<div class="header">
  <div class="logo">AI</div>
  <div class="htext">
    <div class="title">AI COMMANDER</div>
    <div class="subtitle">MULTI-LLM CONTROL INTERFACE v1.0</div>
  </div>
  <div class="dot"></div>
</div>

<div class="panels">

  <div class="panel" id="panel-chatgpt">
    <div class="ph">
      <div class="badge" style="color:#00ff41;border-color:#00ff4150;background:rgba(0,255,65,0.07)">GPT</div>
      <span class="alabel">CHATGPT · OPENAI</span>
      <span class="sbadge" id="s-chatgpt">IDLE</span>
      <button class="sbtn" onclick="sendOne('chatgpt')">SEND ▶</button>
    </div>
    <div class="pb">
      <textarea id="p-chatgpt" placeholder="→ Frontend task (React, UI, HTML/CSS components...)"></textarea>
    </div>
  </div>

  <div class="panel" id="panel-claude">
    <div class="ph">
      <div class="badge" style="color:#ff8c42;border-color:#ff8c4250;background:rgba(255,140,66,0.07)">CLA</div>
      <span class="alabel">CLAUDE · ANTHROPIC</span>
      <span class="sbadge" id="s-claude">IDLE</span>
      <button class="sbtn" onclick="sendOne('claude')">SEND ▶</button>
    </div>
    <div class="pb">
      <textarea id="p-claude" placeholder="→ Backend task (API, logic, architecture, debug...)"></textarea>
    </div>
  </div>

  <div class="panel" id="panel-gemini">
    <div class="ph">
      <div class="badge" style="color:#4fc3f7;border-color:#4fc3f750;background:rgba(79,195,247,0.07)">GEM</div>
      <span class="alabel">GEMINI · GOOGLE</span>
      <span class="sbadge" id="s-gemini">IDLE</span>
      <button class="sbtn" onclick="sendOne('gemini')">SEND ▶</button>
    </div>
    <div class="pb">
      <textarea id="p-gemini" placeholder="→ Research, images, Google APIs, documentation..."></textarea>
    </div>
  </div>

  <div class="panel" id="panel-grok">
    <div class="ph">
      <div class="badge" style="color:#bf5fff;border-color:#bf5fff50;background:rgba(191,95,255,0.07)">GRK</div>
      <span class="alabel">GROK · XAI</span>
      <span class="sbadge" id="s-grok">IDLE</span>
      <button class="sbtn" onclick="sendOne('grok')">SEND ▶</button>
    </div>
    <div class="pb">
      <textarea id="p-grok" placeholder="→ Database schema, creative ideas, real-time info..."></textarea>
    </div>
  </div>

</div>

<div class="bottom">
  <button class="firebtn" onclick="fireAll()">⚡ &nbsp; FIRE ALL SYSTEMS &nbsp; ⚡</button>
  <div class="logbox" id="logbox">
    <div class="le inf">» SYSTEMS ONLINE. AWAITING ORDERS.</div>
  </div>
  <div class="row">
    <span class="counter" id="counter">0 / 4 TARGETS LOADED</span>
    <button class="clrbtn" onclick="clearAll()">✕ CLEAR ALL</button>
  </div>
</div>

<script>
const BOTS = ['chatgpt','claude','gemini','grok'];

function log(msg, type='') {
  const box = document.getElementById('logbox');
  const d = document.createElement('div');
  d.className = 'le ' + type;
  d.textContent = '» ' + msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function setStatus(bot, s) {
  const el = document.getElementById('s-' + bot);
  el.textContent = s;
  el.className = 'sbadge' + (s==='SENDING'?' sending':s==='DONE'?' done':s==='ERROR'?' error':'');
}

function updateCounter() {
  const n = BOTS.filter(b => document.getElementById('p-' + b).value.trim()).length;
  document.getElementById('counter').textContent = n + ' / 4 TARGETS LOADED';
}
BOTS.forEach(b => document.getElementById('p-' + b).addEventListener('input', updateCounter));

async function sendOne(bot) {
  const prompt = document.getElementById('p-' + bot).value.trim();
  if (!prompt) { log('No prompt for ' + bot.toUpperCase(), 'err'); return; }

  setStatus(bot, 'SENDING');
  log('Dispatching to ' + bot.toUpperCase() + '...', 'inf');

  // When running as installed extension, use chrome.runtime.sendMessage
  if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
    try {
      const res = await chrome.runtime.sendMessage({ action:'sendToBot', bot, prompt });
      if (res?.ok) { setStatus(bot,'DONE'); log(bot.toUpperCase() + ' ✓ prompt delivered','ok'); }
      else          { setStatus(bot,'ERROR'); log(bot.toUpperCase() + ' ✗ ' + (res?.error||'failed'),'err'); }
    } catch(e) {
      setStatus(bot,'ERROR');
      log(bot.toUpperCase() + ' ✗ ' + e.message, 'err');
    }
  } else {
    // DEMO MODE (artifact preview - simulates the flow)
    await new Promise(r => setTimeout(r, 800 + Math.random()*600));
    setStatus(bot, 'DONE');
    log(bot.toUpperCase() + ' ✓ [DEMO MODE — install as extension to activate]', 'ok');
  }
}

async function fireAll() {
  const active = BOTS.filter(b => document.getElementById('p-' + b).value.trim());
  if (!active.length) { log('NO TARGETS LOADED. Enter prompts first.','err'); return; }
  log('FIRING ' + active.length + ' SYSTEMS SIMULTANEOUSLY...','inf');
  await Promise.all(active.map(b => sendOne(b)));
  log('ALL SYSTEMS FIRED. MONITOR BROWSER TABS.','ok');
}

function clearAll() {
  BOTS.forEach(b => { document.getElementById('p-'+b).value=''; setStatus(b,'IDLE'); });
  document.getElementById('logbox').innerHTML = '<div class="le inf">» SYSTEMS CLEARED. READY FOR NEW MISSION.</div>';
  updateCounter();
}

// Persist prompts (extension context only)
BOTS.forEach(b => {
  document.getElementById('p-'+b).addEventListener('input', () => {
    if (typeof chrome !== 'undefined' && chrome.storage)
      chrome.storage.local.set({ [b+'_p']: document.getElementById('p-'+b).value });
  });
});

// Restore on load
if (typeof chrome !== 'undefined' && chrome.storage) {
  chrome.storage.local.get(BOTS.map(b => b+'_p'), d => {
    BOTS.forEach(b => { if(d[b+'_p']) document.getElementById('p-'+b).value = d[b+'_p']; });
    updateCounter();
  });
}
</script>
</body>
</html>
